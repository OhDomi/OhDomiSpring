spring:
  application:
    name: backend

  datasource:
    # File-backed in development so data survives application restarts.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ohdomi;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  sql:
    init:
      mode: always
      encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  error:
    include-message: always
